<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Switzerland! — Talking Travel</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="./index.html" aria-label="Talking Travel — на главную">
        <img class="logo__image" src="./img/logo.svg" alt="" width="100" height="64">
      </a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="./index.html">Home</a></li>
          <li><a class="site-nav__link site-nav__link--active" href="./blog.html" aria-current="page">Story</a></li>
          <li><a class="site-nav__link" href="#">Gallery</a></li>
          <li><a class="site-nav__link" href="#">Contact Us</a></li>
        </ul>
      </nav>

      <div class="site-header__actions">
        <button class="icon-button icon-button--search" type="button" aria-label="Поиск">
          <svg class="icon" width="20" height="20" aria-hidden="true" focusable="false"></svg>
        </button>
        <a class="icon-button icon-button--profile" href="#" aria-label="Профиль">
          <svg class="icon" width="24" height="24" aria-hidden="true" focusable="false"></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main">

    <article class="post">

      <header class="post__header">
        <div class="post__intro">
          <p class="eyebrow">Popular destinations</p>
          <h1 class="post__title" id="post-title">Hello Switzerland!</h1>
        </div>
        <div class="post__author">
          <img class="post__author-avatar" src="./img/author-darrell.jpg" alt="" width="35" height="35">
          <p class="post__author-text">
            <span class="post__author-name">Darrell Steward</span>
            <span class="post__author-role">Author / Photographer</span>
          </p>
        </div>
      </header>

      <figure class="post__media">
        <img class="post__image" src="./img/switzerland-hero.jpg"
             alt="Путешественник на фоне горы Маттерхорн" width="912" height="540">
        <figcaption class="visually-hidden">Видео: The Matterhorn</figcaption>
        <button class="play-button play-button--xl" type="button" aria-label="Воспроизвести видео о Маттерхорне">
          <svg width="52" height="52" aria-hidden="true" focusable="false"></svg>
        </button>
      </figure>

    </article>

  </main>
</body>
</html>
